# Parameters of the G2 torque subscriber (C++ torque_subscriber_node and Python
# torque_subscriber_node.py read the same file).
/**:
  ros__parameters:
    # Robot access (C++ node only): "gdk" (real robot), "fake" (simulated arms) or a module path.
    # The Python node uses whichever agibot_gdk is on PYTHONPATH.
    backend: "gdk"

    # Gravity compensation model. Empty urdf_path: use <urdf_dir>/<urdf_type>/<urdf_type>.urdf
    # with the urdf_type the robot reports (urdf_dir below is the path on the robot itself).
    urdf_path: ""
    urdf_dir: "/home/agi/app/share/genie_robot_description/urdf"

    # Commands: std_msgs/Float64MultiArray, 7 values (joint1..7, Nm), added on top of gravity
    # compensation. QoS KeepLast(1) / BestEffort / Volatile, as in the Franka torque subscriber.
    left_torque_topic: "~/left/external_torques"
    right_torque_topic: "~/right/external_torques"
    command_timeout: 0.1          # s; after that the arm's external torque is 0 (gravity comp stays)

    # State output (sensor_msgs/JointState). Empty topic name = not published.
    joint_states_topic: "joint_states"                 # all joints the robot reports
    left_joint_states_topic: "~/left/joint_states"     # 7 joints, measured q / dq / effort
    right_joint_states_topic: "~/right/joint_states"
    commanded_torques_topic: "~/commanded_torques"     # 14 joints, effort = total torque sent
    publish_decimation: 1         # publish every n-th frame (1 = 1 kHz)

    # Safety
    max_torque_step: 15.0         # Nm per frame per joint (robot e-stops at > 50)
    effort_limit_scale: 1.0       # clamp total torque to this fraction of the URDF effort limit
    joint_damping: 0.0            # Nm*s/rad, added as -joint_damping * dq (0 = Franka-like)
    velocity_limit: 2.0           # rad/s; any arm joint faster -> end stream, restore mode (0 = off)
    gravity_check_tolerance: 10.0 # Nm; refuse to start if |g(q) - measured effort| exceeds it (0 = off)

    # Loop
    dry_run: false                # read + compute + publish, never switch mode or send torque
    dry_run_rate: 100.0           # Hz
    enforce_realtime: false       # true: fail if SCHED_FIFO cannot be set (needs rtprio permission)
    state_timeout_ms: 100         # one missing robot frame for this long ends the loop
